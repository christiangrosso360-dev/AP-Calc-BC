<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grapher — the universal renderer</title>
<meta name="robots" content="noindex,follow" />
<style>
  :root{ --gold:#f0b429; --glow:#ffd66b; --teal:#3fd0b0; --mag:#e884ea; --coral:#e0644f;
         --ink:#f4efe2; --mut:#a99e86; --axis:#4a3c22; --grid:#241d0f; --bg0:#0c0a05; --bg1:#14100a;
         --mono:ui-monospace,'Cascadia Code',Menlo,monospace; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg1);color:var(--ink);font-family:Georgia,serif}
  .stage{position:relative;width:100%;height:100vh;background:radial-gradient(circle at 50% 44%,var(--bg1),var(--bg0) 78%)}
  #cv{display:block;width:100%;height:100%}
  .cap{position:absolute;left:22px;top:18px;font-family:var(--mono);font-size:13px;color:var(--mut);letter-spacing:.02em;pointer-events:none}
  .legend{position:absolute;right:22px;top:18px;display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:none}
  .lg{font-family:var(--mono);font-size:13px;display:flex;align-items:center;gap:8px}
  .lg .sw{width:16px;height:3px;border-radius:2px}
  .replay{position:absolute;left:22px;bottom:18px;font-family:var(--mono);font-size:12px;color:var(--mut);background:rgba(12,10,5,.7);border:1px solid var(--axis);border-radius:8px;padding:8px 14px;cursor:pointer}
  .replay:hover{color:var(--ink);border-color:var(--gold)}
  /* ?embed=1 → a slim attribution footer, so the widget carries the brand on someone else's page */
  .embed-bar{display:none;position:fixed;left:0;right:0;bottom:0;height:26px;align-items:center;
    justify-content:space-between;padding:0 11px;background:#0b0904;border-top:1px solid rgba(240,180,41,.16);
    font-family:var(--mono);font-size:11px;color:#8e836c;z-index:5}
  .embed-bar a{color:var(--gold);text-decoration:none}
  .embed-bar a:hover{text-decoration:underline}
  body.embed .stage{height:calc(100vh - 26px)}
  body.embed .embed-bar{display:flex}
  body.embed .cap{display:none}            /* caption moves into the footer — keeps the canvas pure */
  .embed-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
  /* narrow screens: a long caption top-left would collide with the legend top-right — drop it to the bottom */
  @media (max-width:460px){
    .legend{top:14px;right:14px}
    .cap{top:auto;bottom:14px;left:14px;right:104px;font-size:12px;line-height:1.3;
         background:rgba(12,10,5,.66);padding:6px 9px;border-radius:7px}
    .replay{left:auto;right:14px;bottom:14px;padding:7px 12px}
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="cap" id="cap"></div>
  <div class="legend" id="legend"></div>
  <button class="replay" id="replay">↺ replay</button>
</div>
<div class="embed-bar">
  <span id="embedCap"></span>
  <a href="https://visualcalculus.org/visualizer.html" target="_blank" rel="noopener">Visual Calculus ↗</a>
</div>
<script>
/* ================= EXPRESSION PARSER (ported from Revolve) ================= */
const FN_ALIAS={arcsin:'asin',arccos:'acos',arctan:'atan'};
function tokenize(s){ s=s.replace(/\s+/g,''); if(!s) throw new Error('empty'); const T=[]; let i=0;
  const dig=c=>c>='0'&&c<='9', alp=c=>(c>='a'&&c<='z')||(c>='A'&&c<='Z');
  while(i<s.length){ const c=s[i];
    if(dig(c)||c==='.'){ let j=i+1; while(j<s.length&&(dig(s[j])||s[j]==='.'))j++; T.push({t:'num',v:parseFloat(s.slice(i,j))}); i=j; }
    else if(alp(c)){ let j=i+1; while(j<s.length&&(alp(s[j])||dig(s[j])))j++; T.push({t:'id',v:s.slice(i,j).toLowerCase()}); i=j; }
    else if('+-*/^()'.includes(c)){ T.push({t:c}); i++; } else throw new Error('bad char '+c); } return T; }
function parse(str){ const T=tokenize(str); let p=0; const peek=()=>T[p], adv=()=>T[p++];
  function expr(){ let a=term(); while(peek()&&(peek().t==='+'||peek().t==='-')){ const o=adv().t; a={t:o==='+'?'add':'sub',a,b:term()}; } return a; }
  function term(){ let a=un(); while(peek()){ const k=peek().t; if(k==='*'||k==='/'){ adv(); a={t:k==='*'?'mul':'div',a,b:un()}; } else if(k==='num'||k==='id'||k==='('){ a={t:'mul',a,b:un()}; } else break; } return a; }
  function un(){ if(peek()&&peek().t==='-'){ adv(); return {t:'neg',a:un()}; } if(peek()&&peek().t==='+'){ adv(); return un(); } return pw(); }
  function pw(){ const a=atom(); if(peek()&&peek().t==='^'){ adv(); return {t:'pow',a,b:un()}; } return a; }
  function atom(){ const k=peek(); if(!k) throw new Error('end');
    if(k.t==='num'){ adv(); return {t:'num',v:k.v}; }
    if(k.t==='('){ adv(); const e=expr(); ex(')'); return e; }
    if(k.t==='id'){ adv(); const nm=k.v; if(nm==='x') return {t:'var'}; if(nm==='y') return {t:'vary'};
      if(nm==='pi') return {t:'num',v:Math.PI}; if(nm==='e'&&!(peek()&&peek().t==='(')) return {t:'num',v:Math.E};
      if(peek()&&peek().t==='('){ adv(); const arg=expr(); ex(')'); return {t:'call',name:FN_ALIAS[nm]||nm,arg}; }
      throw new Error('unknown '+nm); } throw new Error('token'); }
  function ex(t){ if(!peek()||peek().t!==t) throw new Error('expected '+t); adv(); }
  const a=expr(); if(p<T.length) throw new Error('trailing'); return a; }
const FNS={ sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,
  sec:x=>1/Math.cos(x),csc:x=>1/Math.sin(x),cot:x=>1/Math.tan(x),ln:Math.log,log:x=>Math.log10(x),log2:Math.log2,exp:Math.exp,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,
  fact:x=>{ x=Math.round(x); if(x<0||x>170) return NaN; let r=1; for(let i=2;i<=x;i++) r*=i; return r; } };
function ev(n,x,y){ switch(n.t){ case 'num':return n.v; case 'var':return x; case 'vary':return y; case 'neg':return -ev(n.a,x,y);
  case 'add':return ev(n.a,x,y)+ev(n.b,x,y); case 'sub':return ev(n.a,x,y)-ev(n.b,x,y); case 'mul':return ev(n.a,x,y)*ev(n.b,x,y); case 'div':return ev(n.a,x,y)/ev(n.b,x,y);
  case 'pow':return Math.pow(ev(n.a,x,y),ev(n.b,x,y)); case 'call':{ const f=FNS[n.name]; if(!f) throw new Error('fn '+n.name); return f(ev(n.arg,x,y)); } } }
function compile(expr){ const ast=parse(expr); return x=>{ try{ const v=ev(ast,x); return isFinite(v)?v:NaN; }catch(e){ return NaN; } }; }
// two-variable form for slope fields: dy/dx = f(x, y)
function compile2(expr){ const ast=parse(expr); return (x,y)=>{ try{ const v=ev(ast,x,y); return isFinite(v)?v:NaN; }catch(e){ return NaN; } }; }

/* ================= COLORS ================= */
const COL={ gold:'#f0b429', glow:'#ffd66b', teal:'#3fd0b0', mag:'#e884ea', coral:'#e0644f', ink:'#f4efe2' };
const cget=c=>COL[c]||c||COL.gold;

/* ================= SCENE ================= */
// default demo scene — swapped via ?s=<base64 json> or postMessage later
const DEFAULT_SCENE={
  functions:[ {expr:'x^2', color:'gold', label:'f(x) = x²'}, {expr:'2x', color:'teal', label:'g(x) = 2x'} ],
  domain:[-1.2, 3.2],
  shade:{ between:[0,1], interval:[0,2], color:'gold' },
  lines:[ {type:'tangent', to:0, at:2} ],
  points:[ {x:2, on:0, label:'P'} ],
  caption:'the region between two curves, and a tangent'
};
// coerce any numeric field to a real number, even if the AI wrote "pi", "e^(1)", "2*pi"
function num(v,dflt){
  if(typeof v==='number'&&isFinite(v)) return v;
  if(typeof v==='string'){ try{ const y=compile(v)(0); if(isFinite(y)) return y; }catch(e){} const f=parseFloat(v); if(isFinite(f)) return f; }
  return dflt;
}
function sanitizeScene(s){
  if(Array.isArray(s.domain)) s.domain=[num(s.domain[0],-5),num(s.domain[1],5)];
  if(s.shade&&Array.isArray(s.shade.interval)) s.shade.interval=[num(s.shade.interval[0]),num(s.shade.interval[1])];
  (s.points||[]).forEach(p=>{ if(p.x!=null)p.x=num(p.x,0); if(p.y!=null)p.y=num(p.y); });
  (s.lines||[]).forEach(l=>{ if(l.at!=null)l.at=num(l.at); if(l.from!=null)l.from=num(l.from); });
  if(s.riemann){ s.riemann.a=num(s.riemann.a); s.riemann.b=num(s.riemann.b); if(s.riemann.n!=null)s.riemann.n=num(s.riemann.n,10); }
  if(s.animate){ if(s.animate.from!=null)s.animate.from=num(s.animate.from); if(s.animate.to!=null)s.animate.to=num(s.animate.to); if(s.animate.a!=null)s.animate.a=num(s.animate.a); if(s.animate.b!=null)s.animate.b=num(s.animate.b); }
  if(s.psum){ s.psum.from=Math.round(num(s.psum.from,1)); s.psum.N=Math.round(num(s.psum.N,28)); if(s.psum.limit!=null)s.psum.limit=num(s.psum.limit); }
  [].concat(s.param||[],s.polar||[]).forEach(c=>{ if(Array.isArray(c.t)) c.t=[num(c.t[0],0),num(c.t[1],6.28318531)]; });
  [].concat(s.implicit||[]).forEach(c=>{ if(Array.isArray(c.tangentAt)) c.tangentAt=[num(c.tangentAt[0],0),num(c.tangentAt[1],0)]; });
  if(s.field) [].concat(s.field.solutions||[]).forEach(sol=>{ sol.x0=num(sol.x0,0); sol.y0=num(sol.y0,0);
    if(sol.euler){ sol.euler.h=num(sol.euler.h,0.5); sol.euler.steps=Math.round(num(sol.euler.steps,6)); } });
  return s;
}
// pre-parse: turn bare symbols in numeric slots (e.g. [-pi,pi]) into numbers WITHOUT touching quoted exprs
function jsonRepair(str){
  let out='',inStr=false,esc=false;
  for(let i=0;i<str.length;i++){ const c=str[i];
    if(inStr){ out+=c; if(esc)esc=false; else if(c==='\\')esc=true; else if(c==='"')inStr=false; continue; }
    if(c==='"'){ inStr=true; out+=c; continue; }
    out+=c; }
  // outside strings only: replace whole-word pi / e with numeric literals
  return out.replace(/(^|[^A-Za-z0-9_"])pi\b/g,(m,p)=>p+'3.14159265').replace(/(^|[^A-Za-z0-9_".])e\b(?!\^)/g,(m,p)=>p+'2.71828183');
}
function loadScene(){
  try{ const s=new URLSearchParams(location.search).get('s');
    if(s){ const json=decodeURIComponent(escape(atob(s)));
      let obj; try{ obj=JSON.parse(json); }catch(e){ obj=JSON.parse(jsonRepair(json)); }
      return sanitizeScene(obj); } }catch(e){}
  return sanitizeScene(DEFAULT_SCENE);
}

/* ================= RENDERER ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1, SCENE=null, FNS_C=[], BADFN=0, PSUM=null, PARAM=null, FIELD=null, IMPL=null, ANLZ=null, DOM=[-5,5], YR=[-5,5], M=null, T0=0, RAF=null, FINAL=false, SAFETY=null, ANIM_STATIC=null;

function niceStep(range,target){ const raw=range/target, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  const s=n<1.5?1:n<3?2:n<7?5:10; return s*mag; }

function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); const r=cv.getBoundingClientRect();
  W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); computeView(); }

function computeView(){
  const padL0=54,padR0=26,padT0=26,padB0=40;
  // parametric / polar: bounds come from the sampled xy points, and the aspect is LOCKED
  // (a circle must look like a circle — otherwise every polar rose is a lie)
  if(PARAM){
    let x0=Infinity,x1=-Infinity,y0p=Infinity,y1p=-Infinity;
    for(const c of PARAM) for(const p of c.pts){
      if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0p)y0p=p[1]; if(p[1]>y1p)y1p=p[1]; }
    if(!isFinite(x0)||!isFinite(y0p)){ x0=-1;x1=1;y0p=-1;y1p=1; }
    const px=(x1-x0||2)*0.12, py=(y1p-y0p||2)*0.12;
    x0-=px; x1+=px; y0p-=py; y1p+=py;
    const pxW=Math.max(1,W-padL0-padR0), pxH=Math.max(1,H-padT0-padB0);
    const s=Math.max((x1-x0)/pxW,(y1p-y0p)/pxH);          // one world-unit-per-pixel for BOTH axes
    const cx=(x0+x1)/2, cy=(y0p+y1p)/2, hw=s*pxW/2, hh=s*pxH/2;
    DOM=[cx-hw,cx+hw]; YR=[cy-hh,cy+hh];
    M={ sx:x=>padL0+((x-DOM[0])/(DOM[1]-DOM[0]))*pxW, sy:y=>H-padB0-((y-YR[0])/(YR[1]-YR[0]))*pxH,
        ux:p=>DOM[0]+((p-padL0)/pxW)*(DOM[1]-DOM[0]) };
    return;
  }
  const [a,b]=DOM; const N=400; let ys=[];
  for(const f of FNS_C){ for(let i=0;i<=N;i++){ const y=f(a+(b-a)*i/N); if(isFinite(y)) ys.push(y); } }
  if(PSUM){ for(const p of PSUM.pts) ys.push(p[1]); if(PSUM.limit!=null) ys.push(PSUM.limit); ys.push(0); }
  let y0,y1;
  if(SCENE.yrange && SCENE.yrange[0]!=null){ y0=SCENE.yrange[0]; y1=SCENE.yrange[1]; }
  else if(ys.length){ ys.sort((p,q)=>p-q); const lo=ys[Math.floor(ys.length*0.02)], hi=ys[Math.floor(ys.length*0.98)];
    y0=Math.min(lo,0); y1=Math.max(hi,0); const pad=(y1-y0||1)*0.12; y0-=pad; y1+=pad; }
  else { y0=-5; y1=5; }
  const padL=54,padR=26,padT=26,padB=40+(ANLZ?48:0);   // analysis reserves a band for the sign strips
  let x0=a,x1=b;
  if(IMPL){   // implicit curves are shapes, not graphs — lock the aspect so a circle IS a circle
    const pxW=Math.max(1,W-padL-padR), pxH=Math.max(1,H-padT-padB);
    const s=Math.max((x1-x0)/pxW,(y1-y0)/pxH);
    const cx=(x0+x1)/2, cy=(y0+y1)/2, hw=s*pxW/2, hh=s*pxH/2;
    x0=cx-hw; x1=cx+hw; y0=cy-hh; y1=cy+hh;
    DOM=[x0,x1];
  }
  YR=[y0,y1];
  M={ sx:x=>padL+((x-x0)/(x1-x0))*(W-padL-padR), sy:y=>H-padB-((y-y0)/(y1-y0))*(H-padT-padB),
      ux:px=>x0+((px-padL)/(W-padL-padR))*(x1-x0), padB:padB, padL:padL, padR:padR };
  if(IMPL) IMPL.forEach(c=>c._segs=null);   // marching-squares grid is view-dependent → recompute
}

function drawGrid(){
  const [a,b]=DOM,[y0,y1]=YR;
  ctx.lineWidth=1; ctx.font='12px '+getComputedStyle(document.body).getPropertyValue('--mono');
  const xs=niceStep(b-a,9), ys=niceStep(y1-y0,7);
  ctx.strokeStyle='rgba(74,60,34,.22)';
  for(let x=Math.ceil(a/xs)*xs; x<=b; x+=xs){ ctx.beginPath(); ctx.moveTo(M.sx(x),M.sy(y1)); ctx.lineTo(M.sx(x),M.sy(y0)); ctx.stroke(); }
  for(let y=Math.ceil(y0/ys)*ys; y<=y1; y+=ys){ ctx.beginPath(); ctx.moveTo(M.sx(a),M.sy(y)); ctx.lineTo(M.sx(b),M.sy(y)); ctx.stroke(); }
  // axes
  ctx.strokeStyle='rgba(120,100,60,.75)'; ctx.lineWidth=1.5;
  const yAx=(0>=y0&&0<=y1)?M.sy(0):M.sy(y0<0?y1:y0);
  const xAx=(0>=a&&0<=b)?M.sx(0):M.sx(a<0?b:a);
  ctx.beginPath(); ctx.moveTo(M.sx(a),yAx); ctx.lineTo(M.sx(b),yAx); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xAx,M.sy(y0)); ctx.lineTo(xAx,M.sy(y1)); ctx.stroke();
  // tick labels
  ctx.fillStyle='rgba(169,158,134,.85)'; ctx.textAlign='center'; ctx.textBaseline='top';
  for(let x=Math.ceil(a/xs)*xs; x<=b; x+=xs){ if(Math.abs(x)<1e-9) continue; ctx.fillText((+x.toFixed(4)).toString(), M.sx(x), yAx+6); }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let y=Math.ceil(y0/ys)*ys; y<=y1; y+=ys){ if(Math.abs(y)<1e-9) continue; ctx.fillText((+y.toFixed(4)).toString(), xAx-8, M.sy(y)); }
}

function funcPath(f,prog){
  const [a,b]=DOM; const N=600; const upto=a+(b-a)*prog;
  // A pole (tan x, 1/x) is NOT a vertical line. Samples either side of it are finite and modest,
  // so the only reliable tell is that ONE step jumps further than the whole plot is tall.
  const plotH=Math.max(1,H-26-(M.padB||40)), MAXJUMP=plotH*1.2;
  ctx.beginPath(); let started=false, jumped=true, prevPy=0;
  for(let i=0;i<=N;i++){ const x=a+(b-a)*i/N; if(x>upto+1e-9) break; const y=f(x);
    if(!isFinite(y)||M.sy(y)<-4000||M.sy(y)>4000){ jumped=true; continue; }
    const px=M.sx(x),py=M.sy(y);
    if(!jumped && Math.abs(py-prevPy)>MAXJUMP) jumped=true;    // lift the pen across the discontinuity
    if(jumped){ ctx.moveTo(px,py); jumped=false; } else ctx.lineTo(px,py);
    prevPy=py; started=true; }
  return started;
}

function drawShade(sh,prog){
  const iv=sh.interval||DOM; const [a,b]=iv; const N=200; const col=cget(sh.color);
  const top = sh.between!=null ? FNS_C[sh.between[0]] : FNS_C[sh.under];
  const bot = sh.between!=null ? FNS_C[sh.between[1]] : (()=>0);
  const end=a+(b-a)*Math.min(1,prog*1.15);
  ctx.beginPath(); let first=true;
  for(let i=0;i<=N;i++){ const x=a+(end-a)*i/N; const y=top(x); if(!isFinite(y))continue; if(first){ctx.moveTo(M.sx(x),M.sy(y));first=false;} else ctx.lineTo(M.sx(x),M.sy(y)); }
  for(let i=N;i>=0;i--){ const x=a+(end-a)*i/N; const y=bot(x); if(!isFinite(y))continue; ctx.lineTo(M.sx(x),M.sy(y)); }
  ctx.closePath();
  const g=ctx.createLinearGradient(0,M.sy(YR[1]),0,M.sy(YR[0]));
  g.addColorStop(0,col+'33'); g.addColorStop(1,col+'12'); ctx.fillStyle=g; ctx.fill();
}

function drawRiemann(rm,prog){
  const f=FNS_C[rm.of!=null?rm.of:0]; if(!f) return;
  const a=num(rm.a), b=num(rm.b); if(!isFinite(a)||!isFinite(b)) return;
  const n=Math.max(1,Math.min(200,Math.round(rm.n||10))), rule=rm.rule||'mid', dx=(b-a)/n, col=cget(rm.color||'gold');
  const shown=Math.max(1,Math.floor(n*Math.min(1,prog*1.15)));
  ctx.save();
  for(let k=0;k<shown;k++){ const xl=a+k*dx, xs=rule==='left'?xl:rule==='right'?xl+dx:xl+dx/2, y=f(xs); if(!isFinite(y))continue;
    const x0=M.sx(xl), x1=M.sx(xl+dx), yb=M.sy(0), yt=M.sy(y);
    ctx.fillStyle=col+'26'; ctx.fillRect(x0,Math.min(yb,yt),x1-x0,Math.abs(yt-yb));
    ctx.strokeStyle=col+'aa'; ctx.lineWidth=1; ctx.strokeRect(x0+0.5,Math.min(yb,yt),x1-x0-1,Math.abs(yt-yb)); }
  ctx.restore();
}
function drawAnimate(an,p){
  if(an.kind==='traceParam'){ if(PARAM) drawTrace(an,p); return; }
  if(an.kind==='slidePoint'){
    const f=FNS_C[an.on!=null?an.on:0]; if(!f) return;
    const x=num(an.from,DOM[0])+(num(an.to,DOM[1])-num(an.from,DOM[0]))*p, y=f(x); if(!isFinite(y)) return;
    const h=1e-4, m=(f(x+h)-f(x-h))/(2*h), L=(DOM[1]-DOM[0])*0.26;
    ctx.save();
    ctx.strokeStyle=cget('glow'); ctx.lineWidth=2.4; ctx.beginPath();
    ctx.moveTo(M.sx(x-L),M.sy(y-m*L)); ctx.lineTo(M.sx(x+L),M.sy(y+m*L)); ctx.stroke();
    ctx.shadowColor=cget('glow'); ctx.shadowBlur=16; ctx.fillStyle=cget('glow');
    ctx.beginPath(); ctx.arc(M.sx(x),M.sy(y),7,0,7); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle=cget('glow'); ctx.font='15px '+getComputedStyle(document.body).getPropertyValue('--mono');
    ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillText('slope '+(m>=0?'+':'')+m.toFixed(2), M.sx(x)+12, M.sy(y)-10);
    ctx.restore();
  } else if(an.kind==='riemannN'){
    const n=Math.round(num(an.from,2)+(num(an.to,40)-num(an.from,2))*p);
    drawRiemann({of:an.of, a:an.a, b:an.b, n:Math.max(1,n), rule:an.rule||'mid'}, 1);
    ctx.save(); ctx.fillStyle=cget('glow'); ctx.font='15px '+getComputedStyle(document.body).getPropertyValue('--mono');
    ctx.textAlign='right'; ctx.textBaseline='top'; ctx.fillText('n = '+Math.max(1,n), W-26, 52); ctx.restore();

}
function drawLine(ln,prog){
  const [a,b]=DOM;

  if(ln.type==='tangent'){ const f=FNS_C[ln.to], x0=ln.at, h=1e-4, m=(f(x0+h)-f(x0-h))/(2*h), y0=f(x0);
    const yA=y0+m*(a-x0), yB=y0+m*(b-x0); ctx.strokeStyle=cget(ln.color||'glow'); ctx.globalAlpha=prog;

function drawPoint(pt,prog){
  const f = pt.on!=null ? FNS_C[pt.on] : null; const y = pt.y!=null ? pt.y : (f?f(pt.x):0);
  const px=M.sx(pt.x), py=M.sy(y); const r=6*prog;

/* series: partial sums Sₙ plotted as glowing dots marching toward (or away from) the limit */
function subDigits(k){ const m={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'}; return String(k).split('').map(c=>m[c]||c).join(''); }

/* Unit 7 — slope field: a little tangent segment at each lattice point, drawn at the slope
   it VISUALLY has on screen (x and y pixel scales differ, so the world slope must be converted) */
function drawField(prog){
  const [a,b]=DOM,[y0,y1]=YR, nx=19, ny=12, L=10.5;
  const ppx=M.sx(1)-M.sx(0), ppy=M.sy(1)-M.sy(0);      // pixels per world unit (ppy is negative)
  ctx.save(); ctx.lineCap='round';
  for(let i=0;i<=nx;i++) for(let j=0;j<=ny;j++){
    const x=a+(b-a)*i/nx, y=y0+(y1-y0)*j/ny, m=FIELD.f(x,y);
    if(!isFinite(m)) continue;
    let sx=ppx, sy=m*ppy; const len=Math.hypot(sx,sy); if(!len) continue;
    sx=sx/len*L; sy=sy/len*L;
    const px=M.sx(x), py=M.sy(y);
    // steeper segments read warmer, shallow ones cooler — the field's shape at a glance
    const steep=Math.min(1,Math.abs(m)/3);
    ctx.strokeStyle='rgba('+Math.round(120+120*steep)+','+Math.round(190-40*steep)+','+Math.round(200-90*steep)+','+(0.30+0.30*prog).toFixed(2)+')';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(px-sx,py-sy); ctx.lineTo(px+sx,py+sy); ctx.stroke();
  }
  ctx.restore();
}
// RK4 from (x0,y0) in one direction — the TRUE particular solution the field is hinting at
function solveRK4(f,x0,y0,dir,h,maxSteps){
  const pts=[[x0,y0]]; let x=x0,y=y0; const [ylo,yhi]=YR, pad=(yhi-ylo);
  // a solution curve ENDS at a vertical tangent (e.g. dy/dx = -x/y where y→0) — past that
  // it isn't a function of x any more, and blind stepping produces garbage zigzags
  const maxSlope=15*(yhi-ylo)/(DOM[1]-DOM[0]||1);
  const bad=k=>!isFinite(k)||Math.abs(k)>maxSlope;   // every RK4 stage must stay non-vertical
  for(let i=0;i<maxSteps;i++){
    const k1=f(x,y); if(bad(k1)) break;
    const k2=f(x+dir*h/2,y+dir*h/2*k1), k3=f(x+dir*h/2,y+dir*h/2*k2), k4=f(x+dir*h,y+dir*h*k3);
    if(bad(k2)||bad(k3)||bad(k4)) break;
    const dy=dir*h*(k1+2*k2+2*k3+k4)/6;
    if(!isFinite(dy)||Math.abs(dy)>0.3*pad) break;           // no single step may leap across the view
    y+=dy; x+=dir*h;
    if(!isFinite(y)||y<ylo-pad||y>yhi+pad||x<DOM[0]-0.01||x>DOM[1]+0.01) break;
    pts.push([x,y]);
  }
  return pts;
}
function drawSolutions(prog){
  FIELD.sols.forEach(sol=>{
    const col=cget(sol.color||'gold');
    const back=solveRK4(FIELD.f,sol.x0,sol.y0,-1,(DOM[1]-DOM[0])/400,400).reverse();
    const fwd =solveRK4(FIELD.f,sol.x0,sol.y0, 1,(DOM[1]-DOM[0])/400,400);
    const pts=back.concat(fwd.slice(1));
    const n=Math.max(2,Math.floor(pts.length*prog));
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.shadowColor=col; ctx.shadowBlur=12; ctx.beginPath();
    for(let i=0;i<n;i++){ const px=M.sx(pts[i][0]), py=M.sy(pts[i][1]); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.stroke(); ctx.restore();
    // Euler's method: the jagged approximation next to the smooth truth — the whole point of the lesson
    if(sol.euler&&prog>0.55){
      const h=sol.euler.h, steps=sol.euler.steps; let x=sol.x0,y=sol.y0; const ep=[[x,y]];
      for(let i=0;i<steps;i++){ const m=FIELD.f(x,y); if(!isFinite(m)) break; y+=h*m; x+=h; ep.push([x,y]); }
      // +1e-9: (1-0.55)/0.45 is 0.999999… in floating point, which would silently drop the LAST
      // Euler step and report the wrong y — the readout is an answer, so it has to be exact
      const q=Math.min(1,(prog-0.55)/0.45);
      const shown=Math.max(2,Math.min(ep.length,Math.floor(ep.length*q+1e-9)));
      ctx.save(); ctx.strokeStyle=cget('coral'); ctx.lineWidth=2; ctx.setLineDash([6,4]); ctx.beginPath();
      for(let i=0;i<shown;i++){ const px=M.sx(ep[i][0]), py=M.sy(ep[i][1]); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=cget('coral');
      for(let i=0;i<shown;i++){ ctx.beginPath(); ctx.arc(M.sx(ep[i][0]),M.sy(ep[i][1]),3.2,0,7); ctx.fill(); }
      const last=ep[shown-1];
      ctx.font='12.5px '+getComputedStyle(document.body).getPropertyValue('--mono'); ctx.fillStyle=cget('coral');
      // keep the readout on-canvas even when the solution shoots off the top
      const lx=Math.min(Math.max(M.sx(last[0])+9,10), W-190);
      const floor=lx>W*0.45?78:34;            // stay clear of the legend, which lives top-right
      const ly=Math.min(Math.max(M.sy(last[1])+7,floor), H-30);
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('Euler h='+h+' → y≈'+(+last[1].toFixed(3)), lx, ly);
      ctx.restore();
    }
    ctx.save(); ctx.fillStyle=COL.ink; ctx.shadowColor=col; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(M.sx(sol.x0),M.sy(sol.y0),5,0,7); ctx.fill(); ctx.restore();
  });
}

/* ============ VERIFICATION: the renderer fact-checks the director ============
   The AI is good at reading a problem and bad at arithmetic. We have the actual functions and a
   root-finder, so anything it CLAIMS about intersections or points we can just check ourselves.
   A wrong shaded region is a wrong ANSWER, not a cosmetic issue. */

// the true enclosed region between two curves = the adjacent pair of intersections
// with the most area between them
function enclosedInterval(g,lo,hi){
  const roots=findRoots(g,lo,hi,1200);
  if(roots.length<2) return null;
  let best=null,bestA=-1;
  for(let k=0;k<roots.length-1;k++){
    const a=roots[k],b=roots[k+1]; let A=0; const N=40;
    for(let t=0;t<N;t++){ const v=g(a+(b-a)*(t+0.5)/N); if(isFinite(v)) A+=Math.abs(v)*(b-a)/N; }
    if(A>bestA){ bestA=A; best=[a,b]; }
  }
  return best;
}
function verifyShade(){
  const sh=SCENE.shade; if(!sh) return;
  let fi=null,fj=null;
  if(Array.isArray(sh.between)&&sh.between.length===2){ fi=FNS_C[sh.between[0]]; fj=FNS_C[sh.between[1]]; }
  else if(sh.under!=null){ fi=FNS_C[sh.under]; fj=()=>0; }
  if(!fi||!fj) return;
  const g=x=>fi(x)-fj(x), w=(DOM[1]-DOM[0]);
  const iv=sh.interval;
  const wantAuto = iv==null || iv==='auto' ||
    !(Array.isArray(iv)&&isFinite(iv[0])&&isFinite(iv[1])&&iv[1]>iv[0]);
  if(wantAuto){
    const got=enclosedInterval(g,DOM[0]-w*0.6,DOM[1]+w*0.6);
    if(got) sh.interval=got; else if(!Array.isArray(iv)) delete SCENE.shade;
    return;
  }
  // numeric bounds given: snap endpoints that are ALMOST an intersection onto the exact one
  // (the model routinely rounds 1.5874 to 1.6, which shades a visibly wrong sliver)
  // 4% of the view: comfortably catches a rounded/approximated intersection, while a genuinely
  // stated bound ("from 0 to 1" when the roots are 0 and 2) sits ~25% away and is left alone
  const roots=findRoots(g,DOM[0]-w*0.6,DOM[1]+w*0.6,1200), tol=w*0.04;
  sh.interval=iv.map(v=>{ let best=v,bd=tol;
    for(const r of roots){ const d=Math.abs(r-v); if(d<bd){ bd=d; best=r; } }
    return best; });
}
// a tangent drawn at a point that is NOT on the curve is nonsense — snap it on, or don't draw it
function verifyImplicitPoints(){
  if(!IMPL) return;
  const yspan=(SCENE.yrange&&isFinite(SCENE.yrange[0]))?(SCENE.yrange[1]-SCENE.yrange[0]):(DOM[1]-DOM[0]);
  IMPL.forEach(c=>{
    if(!c.tangentAt) return;
    const tx=c.tangentAt[0], ty=c.tangentAt[1], F=c.f, v=F(tx,ty);
    const scale=Math.max(1e-9, Math.abs(F(tx+0.05,ty)-v)+Math.abs(F(tx,ty+0.05)-v))*20;
    if(isFinite(v)&&Math.abs(v)<=scale*0.05) return;                 // already on the curve
    const roots=findRoots(y=>F(tx,y), ty-yspan*0.6, ty+yspan*0.6, 600);
    if(roots.length){ c.tangentAt=[tx, roots.reduce((p,r)=>Math.abs(r-ty)<Math.abs(p-ty)?r:p)]; }
    else c.tangentAt=null;                                           // nowhere honest to put it
  });
}
// never crop the thing the problem is about out of the picture
function widenDomain(){
  const vals=[];
  if(SCENE.shade&&Array.isArray(SCENE.shade.interval)) vals.push(...SCENE.shade.interval);
  if(SCENE.riemann) vals.push(SCENE.riemann.a,SCENE.riemann.b);
  (SCENE.points||[]).forEach(p=>vals.push(p.x));
  (SCENE.lines||[]).forEach(l=>{ if(l.type!=='horizontal'){ vals.push(l.at); if(l.from!=null) vals.push(l.from); } });
  const fin=vals.filter(v=>typeof v==='number'&&isFinite(v));
  if(!fin.length) return;
  let lo=Math.min(DOM[0],...fin), hi=Math.max(DOM[1],...fin);
  if(lo<DOM[0]||hi>DOM[1]){ const pad=(hi-lo)*0.08; DOM=[lo-pad,hi+pad]; }
}

/* ============ THE ANSWER KEY ============
   Everything below is computed from the ALREADY-VERIFIED scene, so the numbers inherit the
   intersection/point corrections above. These get posted to the parent page and handed to the
   tutor, so it never has to do arithmetic in its head and can never confirm a wrong answer. */
const r4=v=>Math.round(v*1e4)/1e4;
function simpson(f,a,b,n){                       // n even; plenty accurate for exam-sized numbers
  n=Math.max(2,n-(n%2)); const h=(b-a)/n; let s=0;
  for(let i=0;i<=n;i++){ const v=f(a+i*h); if(!isFinite(v)) return NaN;
    s+=v*(i===0||i===n?1:(i%2?4:2)); }
  return s*h/3;
}
function computeFacts(){
  const F={};
  try{
    // area — between two curves, or under one — over the VERIFIED interval
    const sh=SCENE.shade;
    if(sh&&Array.isArray(sh.interval)){
      const [a,b]=sh.interval;
      let g=null, what='';
      if(Array.isArray(sh.between)&&sh.between.length===2){
        const fi=FNS_C[sh.between[0]], fj=FNS_C[sh.between[1]];
        if(fi&&fj){ g=x=>Math.abs(fi(x)-fj(x)); what='area between the curves'; }
      } else if(sh.under!=null&&FNS_C[sh.under]){
        const fi=FNS_C[sh.under]; g=x=>fi(x); what='signed area under the curve';
      }
      if(g){ const v=simpson(g,a,b,400);
        if(isFinite(v)) F.area={value:r4(v), interval:[r4(a),r4(b)], what}; }
    }
    // Riemann sum actually drawn, next to the exact integral it is approximating
    if(SCENE.riemann&&FNS_C[SCENE.riemann.of||0]){
      const rm=SCENE.riemann, f=FNS_C[rm.of||0], n=Math.max(1,Math.round(rm.n||8));
      const a=rm.a, b=rm.b, dx=(b-a)/n, rule=rm.rule||'left';
      let s=0,bad=false;
      for(let i=0;i<n;i++){ const x=rule==='right'?a+(i+1)*dx:rule==='mid'?a+(i+0.5)*dx:a+i*dx;
        const v=f(x); if(!isFinite(v)){bad=true;break;} s+=v*dx; }
      const exact=simpson(f,a,b,400);
      if(!bad&&isFinite(s)) F.riemann={rule,n,sum:r4(s),exact:isFinite(exact)?r4(exact):null,
        error:isFinite(exact)?r4(Math.abs(exact-s)):null};
    }
    // critical / inflection points (already located and classified for the sign charts)
    if(ANLZ){ if(!ANLZ._r) ANLZ._r=analyze();
      F.critical=ANLZ._r.crit.map(c=>({x:r4(c.x),y:r4(c.y),kind:c.kind||'?'}));
      F.inflection=ANLZ._r.infl.map(i=>({x:r4(i.x),y:r4(i.y)})); }
    // implicit dy/dx at the (verified, on-curve) point
    if(IMPL) IMPL.forEach(c=>{ if(!c.tangentAt) return;
      const tx=c.tangentAt[0], ty=c.tangentAt[1], h=1e-5;
      const Fx=(c.f(tx+h,ty)-c.f(tx-h,ty))/(2*h), Fy=(c.f(tx,ty+h)-c.f(tx,ty-h))/(2*h);
      F.implicitSlope=(isFinite(Fx)&&isFinite(Fy)&&Math.abs(Fy)>1e-7)
        ? {at:[r4(tx),r4(ty)], dydx:r4(-Fx/Fy)} : {at:[r4(tx),r4(ty)], dydx:'undefined (vertical tangent)'}; });
    // series: where the partial sums actually go
    if(PSUM){ const last=PSUM.pts[PSUM.pts.length-1];
      F.series={term:PSUM.term, partialSumAt:last[0], partialSum:r4(last[1]),
                limit:PSUM.limit!=null?r4(PSUM.limit):null,
                verdict:PSUM.limit!=null?'converges':'diverges (partial sums keep growing)'}; }
    // Euler vs the true solution at the same x
    if(FIELD) FIELD.sols.forEach(sol=>{ if(!sol.euler) return;
      const h=sol.euler.h, steps=sol.euler.steps; let x=sol.x0,y=sol.y0, ok=true;
      for(let i=0;i<steps;i++){ const m=FIELD.f(x,y); if(!isFinite(m)){ok=false;break;} y+=h*m; x+=h; }
      if(!ok) return;
      const t=solveRK4(FIELD.f,sol.x0,sol.y0,1,Math.abs(h)/50,Math.round(50*steps));
      const tl=t[t.length-1];
      F.euler={h,steps,atX:r4(x),estimate:r4(y),
               trueValue:(tl&&Math.abs(tl[0]-x)<1e-6)?r4(tl[1]):null}; });
  }catch(e){}
  return F;
}

/* Unit 5 — curve analysis: find where f' and f" change sign, mark and CLASSIFY them, and draw
   sign strips. The point is to ANSWER "where is it increasing / concave up", not make you squint. */
function findRoots(g,a,b,steps){
  // tracks the last NON-ZERO sign, so a sample that lands EXACTLY on the root (very common —
  // f'(0)=0 for any even function on a symmetric domain) is still detected as a crossing
  const out=[]; let lastSign=0, lastX=a, zeroRun=null;
  for(let i=0;i<=steps;i++){
    const x=a+(b-a)*i/steps, v=g(x);
    if(!isFinite(v)){ lastSign=0; zeroRun=null; continue; }
    const s=v>0?1:(v<0?-1:0);
    if(s===0){ zeroRun=zeroRun?[zeroRun[0],x]:[x,x]; continue; }
    if(lastSign!==0&&s!==lastSign){
      if(zeroRun) out.push((zeroRun[0]+zeroRun[1])/2);         // passed through an exact zero
      else{
        let lo=lastX,hi=x,flo=g(lo);
        for(let k=0;k<60;k++){ const mid=(lo+hi)/2, fm=g(mid);
          if(!isFinite(fm)) break;
          if(fm===0){ lo=hi=mid; break; }
          if((flo<0)!==(fm<0)) hi=mid; else { lo=mid; flo=fm; } }
        out.push((lo+hi)/2);
      }
    }
    zeroRun=null; lastSign=s; lastX=x;
  }
  return out;
}
function analyze(){
  const f=FNS_C[ANLZ.of], [a,b]=DOM, h=Math.max(1e-5,(b-a)*1e-5);
  const d1=x=>(f(x+h)-f(x-h))/(2*h), d2=x=>(f(x+h)-2*f(x)+f(x-h))/(h*h);
  const crit=findRoots(d1,a,b,600).filter(x=>isFinite(f(x)));
  const infl=findRoots(d2,a,b,600).filter(x=>isFinite(f(x)));
  const kind=x=>{ const s=d2(x); return !isFinite(s)||Math.abs(s)<1e-6 ? '' : (s>0?'min':'max'); };
  return { f, d1, d2, crit:crit.map(x=>({x,y:f(x),kind:kind(x)})), infl:infl.map(x=>({x,y:f(x)})) };
}
function drawAnalysis(prog){
  if(prog<=0) return;
  if(!ANLZ._r) ANLZ._r=analyze();
  const R=ANLZ._r, [a,b]=DOM, mono=getComputedStyle(document.body).getPropertyValue('--mono');
  // dashed guides + marked, labelled points
  ctx.save(); ctx.globalAlpha=prog;
  R.infl.forEach(p=>{ ctx.strokeStyle='rgba(232,132,234,.35)'; ctx.lineWidth=1.4; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(M.sx(p.x),M.sy(YR[0])); ctx.lineTo(M.sx(p.x),M.sy(YR[1])); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=cget('mag'); ctx.shadowColor=cget('mag'); ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(M.sx(p.x),M.sy(p.y),5,0,7); ctx.fill(); ctx.shadowBlur=0; });
  R.crit.forEach(p=>{ ctx.strokeStyle='rgba(255,214,107,.32)'; ctx.lineWidth=1.4; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(M.sx(p.x),M.sy(YR[0])); ctx.lineTo(M.sx(p.x),M.sy(YR[1])); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=cget('glow'); ctx.shadowColor=cget('glow'); ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(M.sx(p.x),M.sy(p.y),6,0,7); ctx.fill(); ctx.shadowBlur=0;
    if(p.kind){ ctx.fillStyle=COL.ink; ctx.font='13px '+mono; ctx.textAlign='center'; ctx.textBaseline=p.kind==='max'?'bottom':'top';
      ctx.fillText('local '+p.kind+' ('+(+p.x.toFixed(2))+', '+(+p.y.toFixed(2))+')', M.sx(p.x), M.sy(p.y)+(p.kind==='max'?-14:16)); } });
  ctx.restore();
  // the two sign strips, in the band reserved under the axis
  const yBase=H-M.padB+14, sh=15, gap=5;
  const strip=(rowY,cuts,test,posCol,negCol,posTxt,negTxt,name)=>{
    const xs=[a].concat(cuts.map(c=>c.x!==undefined?c.x:c),[b]);
    ctx.save(); ctx.globalAlpha=prog;
    for(let i=0;i<xs.length-1;i++){
      const mid=(xs[i]+xs[i+1])/2, pos=test(mid);
      const x0=M.sx(xs[i]), x1=M.sx(xs[i+1]);
      ctx.fillStyle=pos?posCol:negCol; ctx.fillRect(x0,rowY,Math.max(1,x1-x0),sh);
      if(x1-x0>34){ ctx.fillStyle='rgba(12,10,5,.92)'; ctx.font='11px '+mono; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(pos?posTxt:negTxt,(x0+x1)/2,rowY+sh/2+0.5); }
    }
    ctx.strokeStyle='rgba(120,100,60,.5)'; ctx.lineWidth=1; ctx.strokeRect(M.sx(a),rowY,M.sx(b)-M.sx(a),sh);
    ctx.fillStyle='rgba(169,158,134,.9)'; ctx.font='11px '+mono; ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(name, M.sx(a)-8, rowY+sh/2);
    ctx.restore();
  };
  strip(yBase, R.crit, x=>R.d1(x)>0, 'rgba(63,208,176,.75)', 'rgba(224,100,79,.75)', '↑ incr', '↓ decr', "f '");
  strip(yBase+sh+gap, R.infl, x=>R.d2(x)>0, 'rgba(240,180,41,.72)', 'rgba(232,132,234,.72)', '∪ CU', '∩ CD', 'f "');
}

/* Unit 3 — implicit curves F(x,y)=0 via marching squares. A circle isn't a function of x, so it
   can't go through funcPath(); instead we find where F changes sign across each little grid cell. */
function implicitSegments(f){
  const [a,b]=DOM,[y0,y1]=YR, N=120, segs=[];
  const gx=i=>a+(b-a)*i/N, gy=j=>y0+(y1-y0)*j/N;
  let prev=new Array(N+1), cur=new Array(N+1);
  for(let i=0;i<=N;i++) prev[i]=f(gx(i),gy(0));
  for(let j=1;j<=N;j++){
    for(let i=0;i<=N;i++) cur[i]=f(gx(i),gy(j));
    for(let i=0;i<N;i++){
      const v=[prev[i],prev[i+1],cur[i+1],cur[i]];                        // BL, BR, TR, TL
      if(v[0]!==v[0]||v[1]!==v[1]||v[2]!==v[2]||v[3]!==v[3]) continue;    // NaN corner → skip cell
      const cxs=[gx(i),gx(i+1),gx(i+1),gx(i)], cys=[gy(j-1),gy(j-1),gy(j),gy(j)];
      const hits=[];
      for(let k=0;k<4;k++){ const k2=(k+1)%4, A=v[k], B=v[k2];
        if((A<0)!==(B<0)){ const t=A/(A-B);
          hits.push([cxs[k]+(cxs[k2]-cxs[k])*t, cys[k]+(cys[k2]-cys[k])*t]); } }
      if(hits.length===2) segs.push([hits[0],hits[1]]);
      else if(hits.length===4){ segs.push([hits[0],hits[1]]); segs.push([hits[2],hits[3]]); }  // saddle cell
    }
    const sw=prev; prev=cur; cur=sw;
  }
  return segs;
}
function drawImplicit(prog){
  IMPL.forEach(c=>{
    if(!c._segs) c._segs=implicitSegments(c.f);
    const segs=c._segs; if(!segs.length) return;      // no real solutions → nothing to draw, don't index into []
    const n=Math.max(1,Math.min(segs.length,Math.floor(segs.length*prog)));
    ctx.save(); ctx.strokeStyle=cget(c.color); ctx.lineWidth=3; ctx.lineCap='round';
    ctx.shadowColor=cget(c.color); ctx.shadowBlur=10; ctx.beginPath();
    for(let k=0;k<n;k++){ const s=segs[k];
      ctx.moveTo(M.sx(s[0][0]),M.sy(s[0][1])); ctx.lineTo(M.sx(s[1][0]),M.sy(s[1][1])); }
    ctx.stroke(); ctx.restore();
    // implicit differentiation: dy/dx = -F_x / F_y — the answer the problem is actually asking for
    if(c.tangentAt&&prog>0.7){
      const tx=num(c.tangentAt[0],0), ty=num(c.tangentAt[1],0), h=1e-5;
      const Fx=(c.f(tx+h,ty)-c.f(tx-h,ty))/(2*h), Fy=(c.f(tx,ty+h)-c.f(tx,ty-h))/(2*h);
      const L=(DOM[1]-DOM[0])*0.3;
      ctx.save(); ctx.strokeStyle=cget('glow'); ctx.lineWidth=2.2; ctx.shadowColor=cget('glow'); ctx.shadowBlur=10;
      ctx.beginPath();
      let lbl;
      if(isFinite(Fx)&&isFinite(Fy)&&Math.abs(Fy)>1e-7){
        const m=-Fx/Fy;
        ctx.moveTo(M.sx(tx-L),M.sy(ty-m*L)); ctx.lineTo(M.sx(tx+L),M.sy(ty+m*L));
        lbl='dy/dx = '+(m>=0?'':'')+(+m.toFixed(3));
      } else {                                    // F_y = 0 → the tangent is vertical
        ctx.moveTo(M.sx(tx),M.sy(YR[0])); ctx.lineTo(M.sx(tx),M.sy(YR[1]));
        lbl='dy/dx undefined (vertical)';
      }
      ctx.stroke();
      ctx.shadowColor=cget('glow'); ctx.shadowBlur=16; ctx.fillStyle=cget('glow');
      ctx.beginPath(); ctx.arc(M.sx(tx),M.sy(ty),6,0,7); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle=COL.ink;
      ctx.font='14px '+getComputedStyle(document.body).getPropertyValue('--mono');
      const rt=M.sx(tx)>W-190; ctx.textAlign=rt?'right':'left'; ctx.textBaseline='bottom';
      ctx.fillText(lbl+'  at ('+(+tx.toFixed(2))+', '+(+ty.toFixed(2))+')', M.sx(tx)+(rt?-12:12), M.sy(ty)-12);
      ctx.restore();
    }
  });
}

/* parametric / polar curves: same glow + draw-in as functions, but traced through the point list */
function drawParam(prog){
  PARAM.forEach(c=>{
    const n=Math.max(2,Math.floor(c.pts.length*prog));
    ctx.save(); ctx.strokeStyle=cget(c.color); ctx.lineWidth=3.2; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.shadowColor=cget(c.color); ctx.shadowBlur=10; ctx.beginPath();
    for(let i=0;i<n;i++){ const px=M.sx(c.pts[i][0]), py=M.sy(c.pts[i][1]); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.stroke(); ctx.restore();
  });
}
// a point riding the parametric path — the whole idea of parametric motion, animated
function drawTrace(an,p){
  const c=PARAM[(an&&an.on)||0]; if(!c) return;
  const i=Math.min(c.pts.length-1, Math.max(0, Math.round(p*(c.pts.length-1))));
  const px=M.sx(c.pts[i][0]), py=M.sy(c.pts[i][1]);
  ctx.save(); ctx.shadowColor=COL.glow; ctx.shadowBlur=20; ctx.fillStyle=COL.glow;
  ctx.beginPath(); ctx.arc(px,py,6,0,7); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle=COL.ink; ctx.font='13px '+getComputedStyle(document.body).getPropertyValue('--mono');
  ctx.textAlign=px>W-140?'right':'left'; ctx.textBaseline='bottom';
  ctx.fillText('('+(+c.pts[i][0].toFixed(2))+', '+(+c.pts[i][1].toFixed(2))+')', px+(px>W-140?-12:12), py-11);
  ctx.restore();
}

const STATIC=/[?&]static/.test(location.search);   // ?static → render the final frame instantly (screenshots / fallback)
// ?embed=1 → public-widget mode: slim attribution footer under the stage (set before any sizing happens)
const EMBED=/[?&]embed=1/.test(location.search);
if(EMBED) document.body.classList.add('embed');
function frame(now){
  if(!T0) T0=now; const t=(STATIC||FINAL)?9:(now-T0)/1000;
  const drawP=Math.min(1, t/1.15);              // curves draw in over 1.15s
  const ease=drawP<0.5?2*drawP*drawP:1-Math.pow(-2*drawP+2,2)/2;
  const bg=ctx.createRadialGradient(W/2,H*0.44,0,W/2,H*0.44,Math.max(W,H)*0.78);
  bg.addColorStop(0,'#14100a'); bg.addColorStop(1,'#0c0a05');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  drawGrid();
  if(FIELD){ drawField(ease); drawSolutions(ease); }   // field sits behind everything else
  if(SCENE.riemann) drawRiemann(SCENE.riemann, ease);
  if(SCENE.shade) drawShade(SCENE.shade, ease);
  if(PSUM) drawPsum(Math.min(1, t/2.0));        // partial sums march in one by one over 2s
  // functions with glow, drawn in
  FNS_C.forEach((f,i)=>{ const spec=SCENE.functions[i]; ctx.save();
    ctx.strokeStyle=cget(spec.color); ctx.lineWidth=3.2; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.shadowColor=cget(spec.color); ctx.shadowBlur=10; funcPath(f, ease); ctx.stroke(); ctx.restore(); });
  if(PARAM) drawParam(ease);
  if(IMPL) drawImplicit(ease);
  if(ANLZ) drawAnalysis(Math.min(1,Math.max(0,(t-0.9)/0.8)));
  const overlayP=Math.max(0,(t-0.9)/0.6), op=Math.min(1,overlayP);
  (SCENE.lines||[]).forEach(l=>drawLine(l, op));
  (SCENE.points||[]).forEach(p=>drawPoint(p, op));
  // every expression failed and there's nothing else in the scene → say so, don't show a bare grid
  if(BADFN && BADFN===SCENE.functions.length && !PARAM && !IMPL && !FIELD && !PSUM){
    ctx.save(); ctx.font='15px '+getComputedStyle(document.body).getPropertyValue('--mono');
    ctx.fillStyle='rgba(224,100,79,.95)'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText("couldn't read that expression", W/2, H/2); ctx.restore();
  }
  if(SCENE.animate){
    let ap;
    if(ANIM_STATIC!=null) ap=ANIM_STATIC;                       // one-shot fallback frame (rAF throttled)
    else if(t<1.2) ap=0;                                        // wait for the draw-in
    else if(SCENE.animate.kind==='traceParam') ap=((t-1.2)/4.5)%1;   // motion runs FORWARD and loops (never rewinds)
    else { const ph=((t-1.2)/3.4)%2; ap=ph<1?ph:2-ph; }         // ping-pong sweep, ~3.4s each way
    drawAnimate(SCENE.animate, ap);
    if(ANIM_STATIC==null) RAF=requestAnimationFrame(frame);     // live scenes loop forever
  } else {
    RAF=(t<(PSUM?2.6:2.2) && !FINAL) ? requestAnimationFrame(frame) : null;   // psum reveal runs a bit longer
  }
}

function build(){
  SCENE=loadScene();
  SCENE.functions=SCENE.functions||[];
  // an unparseable expression must not take the whole page down — stub it (keeping indices aligned,
  // since shade/lines/points/analysis all refer to functions by index) and carry on
  BADFN=0;
  const dm=SCENE.domain||[-5,5];
  FNS_C=SCENE.functions.map(f=>{
    let fn=null; try{ fn=compile(f.expr); }catch(e){}
    if(!fn){ BADFN++; return ()=>NaN; }
    // it can PARSE and still be unusable — "f(x)" compiles as a call to an unknown function.
    // If nothing across the domain is finite, treat it as unreadable rather than drawing an empty grid.
    let usable=false;
    for(let k=0;k<=24;k++){ if(isFinite(fn(dm[0]+(dm[1]-dm[0])*k/24))){ usable=true; break; } }
    if(!usable) BADFN++;
    return fn;
  });
  // series: precompute partial sums S_k of the term aₙ (term written in n)
  PSUM=null;
  if(SCENE.psum&&SCENE.psum.term){
    try{
      // factorial notation → fact(); then the term's n becomes the parser's x
      const termSrc=String(SCENE.psum.term)
        .replace(/\bfactorial\s*\(/gi,'fact(')
        .replace(/\(([^()]*)\)\s*!/g,'fact($1)')
        .replace(/([a-z0-9]+)\s*!/gi,'fact($1)')
        .replace(/\bn\b/gi,'x');
      const tf=compile(termSrc);
      const from=SCENE.psum.from!=null?SCENE.psum.from:1, N=Math.max(from+3,SCENE.psum.N!=null?SCENE.psum.N:28);
      let s=0; const pts=[];
      for(let k=from;k<=N;k++){ const a=tf(k); if(isFinite(a)) s+=a; if(isFinite(s)) pts.push([k,s]); }
      if(pts.length>2){
        let limit=(SCENE.psum.limit!=null&&isFinite(SCENE.psum.limit))?SCENE.psum.limit:null;
        // deterministic self-heal: WE computed the real sums — if they've settled and the AI's
        // limit disagrees (e.g. geometric a/(1-r) with the wrong first term), snap to the truth
        const n=pts.length, last=pts[n-1][1];
        const settled=Math.abs(last-pts[n-4][1])<=Math.max(1e-6,Math.abs(last)*0.002);
        if(settled && (limit==null || Math.abs(limit-last)>Math.max(0.02,Math.abs(last)*0.03))) limit=+last.toFixed(4);
        PSUM={pts,from,N,limit,term:SCENE.psum.term};
      }
    }catch(e){ PSUM=null; }
  }
  // Unit 9: parametric (x(t), y(t)) and polar (r(θ)) curves — sampled into xy point lists
  PARAM=null; const pcs=[];
  const asList=v=>v==null?[]:(Array.isArray(v)?v:[v]);
  const tvar=s=>String(s).replace(/θ/g,'theta').replace(/\btheta\b/gi,'x').replace(/\bt\b/gi,'x');
  asList(SCENE.param).forEach(p=>{
    try{
      const fx=compile(tvar(p.x)), fy=compile(tvar(p.y));
      const t0=num(p.t&&p.t[0],0), t1=num(p.t&&p.t[1],6.28318531), N=720, pts=[];
      for(let i=0;i<=N;i++){ const t=t0+(t1-t0)*i/N, X=fx(t), Y=fy(t); if(isFinite(X)&&isFinite(Y)) pts.push([X,Y]); }
      if(pts.length>2) pcs.push({pts,color:p.color||'gold',label:p.label||('x='+p.x+', y='+p.y)});
    }catch(e){}
  });
  asList(SCENE.polar).forEach(p=>{
    try{
      const fr=compile(tvar(p.r));
      const t0=num(p.t&&p.t[0],0), t1=num(p.t&&p.t[1],6.28318531), N=900, pts=[];
      for(let i=0;i<=N;i++){ const th=t0+(t1-t0)*i/N, r=fr(th);
        if(isFinite(r)) pts.push([r*Math.cos(th), r*Math.sin(th)]); }
      if(pts.length>2) pcs.push({pts,color:p.color||'gold',label:p.label||('r = '+p.r)});
    }catch(e){}
  });
  if(pcs.length) PARAM=pcs;
  // Unit 7: slope field dy/dx = f(x,y), plus optional particular-solution curves
  FIELD=null;
  if(SCENE.field&&SCENE.field.dydx){
    try{ FIELD={ f:compile2(String(SCENE.field.dydx).replace(/θ/g,'theta')), sols:[].concat(SCENE.field.solutions||[]) }; }
    catch(e){ FIELD=null; }
  }
  // Unit 3: implicit curves F(x,y)=0 (circles, ellipses, folium…) — the AI moves everything to one side
  IMPL=null;
  const ims=[].concat(SCENE.implicit||[]).map(c=>{
    try{ return { f:compile2(String(c.eq)), color:c.color||'gold', label:c.label||(String(c.eq)+' = 0'),
                  tangentAt:Array.isArray(c.tangentAt)?c.tangentAt:null }; }catch(e){ return null; }
  }).filter(Boolean);
  if(ims.length) IMPL=ims;
  // Unit 5: mark + classify the critical and inflection points of a function
  ANLZ=(SCENE.analysis&&FNS_C.length)?{of:Math.max(0,Math.min(FNS_C.length-1,Math.round(num(SCENE.analysis.of,0))))}:null;
  DOM=SCENE.domain||(PSUM?[0,PSUM.N+1]:[-5,5]);
  try{ verifyShade(); widenDomain(); verifyImplicitPoints(); }catch(e){}   // fact-check the AI's claims
  document.getElementById('cap').textContent=SCENE.caption||'';
  const ec=document.getElementById('embedCap'); if(ec) ec.textContent=SCENE.caption||'';
  let lg=SCENE.functions.map(f=>
    '<div class="lg"><span class="sw" style="background:'+cget(f.color)+'"></span>'+(f.label||f.expr)+'</div>').join('');
  if(PARAM) lg+=PARAM.map(c=>'<div class="lg"><span class="sw" style="background:'+cget(c.color)+'"></span>'+c.label+'</div>').join('');
  if(IMPL) lg+=IMPL.map(c=>'<div class="lg"><span class="sw" style="background:'+cget(c.color)+'"></span>'+c.label+'</div>').join('');
  if(FIELD){ lg+='<div class="lg"><span class="sw" style="background:#8fbfd0"></span>dy/dx = '+SCENE.field.dydx+'</div>';
    if(FIELD.sols.some(s=>s.euler)) lg+='<div class="lg"><span class="sw" style="background:'+cget('coral')+'"></span>Euler approximation</div>'; }
  if(PSUM) lg+='<div class="lg"><span class="sw" style="background:'+cget('gold')+'"></span>'+(SCENE.psum.label||('Sₙ = Σ '+PSUM.term))+'</div>';
  document.getElementById('legend').innerHTML=lg;
  // the sign strips live in the bottom-left band — get the replay button out of their way
  const rp=document.getElementById('replay');
  if(ANLZ){ rp.style.left='auto'; rp.style.right='22px'; } else { rp.style.left=''; rp.style.right=''; }
  resize(); play();
  // hand the verified numbers up to the page so the tutor can be grounded in them
  // (after resize: the true-solution integration needs the final y-range)
  try{ if(window.parent&&window.parent!==window){
    const fid=+(new URLSearchParams(location.search).get('fid')||0);
    window.parent.postMessage({vizFacts:computeFacts(), fid},'*'); } }catch(e){}
}
// start the reveal; a setTimeout safety net forces the COMPLETE frame even if rAF is throttled (embeds / this env)
function play(){
  T0=0; FINAL=false; if(RAF)cancelAnimationFrame(RAF); RAF=requestAnimationFrame(frame);
  clearTimeout(SAFETY); SAFETY=setTimeout(()=>{
    if(SCENE&&SCENE.animate){ FINAL=true; ANIM_STATIC=0.4; frame(performance.now()); FINAL=false; ANIM_STATIC=null; }  // throttled → one good mid-frame (live rAF, if any, keeps going)
    else { if(RAF){cancelAnimationFrame(RAF);RAF=null;} FINAL=true; frame(performance.now()); FINAL=false; }
  }, 2300);
}
window.addEventListener('resize',()=>{ resize(); });
document.getElementById('replay').onclick=play;
build();
</script>
</body>
